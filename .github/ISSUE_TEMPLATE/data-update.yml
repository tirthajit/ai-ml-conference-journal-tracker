name: Conference or journal update
description: Suggest a deadline, ranking, or journal update.
title: "[Update]: "
labels: ["data-update"]
body:
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Acronym and full name
      placeholder: "AAAI — AAAI Conference on Artificial Intelligence"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Prefer official CFP or society page
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: What should be updated?
    validations:
      required: true
